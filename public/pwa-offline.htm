<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#16212b">
<title>Offline · GlobalHostia</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:#16212b;color:#e8edf2;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"IBM Plex Sans Arabic",Tahoma,sans-serif}
  main{width:100%;max-width:440px;text-align:center}
  img{width:72px;height:72px;border-radius:18px}
  h1{margin:20px 0 6px;font-size:24px;line-height:1.25;color:#fff}
  p{margin:0 0 6px;color:#b9c4cf}
  .ar{margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.12)}
  button{margin-top:22px;min-height:46px;padding:0 22px;border:0;border-radius:10px;background:#c5386f;color:#fff;font:600 15px system-ui,sans-serif;cursor:pointer}
  button:focus-visible{outline:2px solid #fdd700;outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" alt="GlobalHostia">
  <h1>You are offline</h1>
  <p>Your services keep running. Reconnect to see your account, pay invoices and reply to tickets.</p>
  <div class="ar" lang="ar" dir="rtl">
    <h1>أنت غير متصل بالإنترنت</h1>
    <p>خدماتك تعمل كالمعتاد. أعد الاتصال لعرض حسابك ودفع الفواتير والرد على التذاكر.</p>
  </div>
  <button type="button" onclick="location.reload()">Try again · إعادة المحاولة</button>
</main>
</body>
</html>
