<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GlobalHostia — Theme Concepts</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--fg:#e8eaf0;--mut:#8b93a7;--acc:#5b8cff}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{padding:28px 32px 8px}h1{margin:0;font-size:22px}p{color:var(--mut);margin:6px 0 0}
.tabs{display:flex;gap:8px;padding:16px 32px;flex-wrap:wrap}
.tabs button{background:var(--card);color:var(--fg);border:1px solid #2a2f3a;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tabs button[disabled]{opacity:.4;cursor:not-allowed}
.view{display:flex;gap:16px;padding:0 32px 32px;align-items:flex-start}
iframe{border:1px solid #2a2f3a;border-radius:10px;background:#fff}
.desk{flex:1;height:82vh;width:100%}
.mob{width:390px;height:82vh;flex:none}
.meta{padding:0 32px 24px;color:var(--mut);font-size:13px}
@media(max-width:900px){.view{flex-direction:column}.mob{width:100%}}
</style></head><body>
<header><h1>GlobalHostia — 5 Theme Concepts</h1><p>Each becomes a selectable theme in Admin → Design Manager. Click a tab; desktop view left, mobile view right. Use the in-page nav to walk Home → Hosting → VPS → Product → Pricing → Domains → Checkout → Dashboard.</p></header>
<div class="tabs" id="tabs"></div>
<div class="view"><iframe class="desk" id="d"></iframe><iframe class="mob" id="m"></iframe></div>
<div class="meta" id="meta"></div>
<script>
const C=[
["1","Premium Minimal","concept-1-premium-minimal.html","Editorial serif/sans, hairline cards, mega-menu."],
["2","Modern Technology","concept-2-modern-tech.html","Dark, gradient glass cards, left-rail nav."],
["3","Enterprise Professional","concept-3-enterprise.html","B2B spec tables, Plex Mono, breadcrumbs + tabs, talk-to-sales."],
["4","Conversion Commerce","concept-4-commerce.html","Store chrome, mini-cart drawer, deal badges, 3-step checkout."],
["5","Bold Next-Gen","concept-5-bold.html","Unbounded display type, bento grid, lime accent, server configurator slider."]];
const tabs=document.getElementById('tabs');
C.forEach(([n,t,f,d],i)=>{const b=document.createElement('button');b.textContent=n+' · '+t;b.onclick=()=>show(i);tabs.appendChild(b);
fetch(f,{method:'HEAD'}).then(r=>{if(!r.ok)b.disabled=true}).catch(()=>b.disabled=true)});
function show(i){const [n,t,f,d]=C[i];[...tabs.children].forEach((b,j)=>b.classList.toggle('on',i===j));
document.getElementById('d').src=f;document.getElementById('m').src=f;document.getElementById('meta').textContent=t+' — '+d;location.hash='c'+n}
show(Math.max(0,C.findIndex(c=>'#c'+c[0]===location.hash)));
</script></body></html>
